<main class="auth-page">
  <section class="auth-card" aria-labelledby="auth-title">
    <a class="brand" href="/" aria-label="StudyHub home">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span>Study<span class="brand-light">Hub</span></span>
    </a>

    <p class="eyebrow">YOUR PERSONAL STUDY SPACE</p>
    <h1 id="auth-title">{{ isRegistering() ? 'Create your account' : 'Welcome back' }}</h1>
    <p class="intro">Sign in to keep your study plan synced securely.</p>

    <button
      class="google-button"
      type="button"
      [disabled]="isSubmitting()"
      (click)="signInWithGoogle()"
    >
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" />
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 38.05 46.98 31.95 46.98 24.55Z" />
        <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z" />
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.2C6.51 42.62 14.62 48 24 48Z" />
      </svg>
      Continue with Google
    </button>
    <div class="separator" aria-hidden="true"><span>or continue with email</span></div>

    <form (ngSubmit)="submit()">
      <label>
        Email
        <input
          name="email"
          type="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
        />
      </label>
      <label>
        Password
        <input
          name="password"
          type="password"
          [attr.autocomplete]="isRegistering() ? 'new-password' : 'current-password'"
          minlength="6"
          [(ngModel)]="password"
          required
        />
      </label>
      @if (errorMessage) {
        <p class="error-message" role="alert">{{ errorMessage }}</p>
      }
      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Please wait…' : isRegistering() ? 'Create account with email' : 'Sign in with email' }}
      </button>
    </form>

    <p class="mode-switch">
      {{ isRegistering() ? 'Already have an account?' : 'New to StudyHub?' }}
      <button type="button" (click)="toggleMode()">
        {{ isRegistering() ? 'Sign in' : 'Create an account' }}
      </button>
    </p>
  </section>
</main>
